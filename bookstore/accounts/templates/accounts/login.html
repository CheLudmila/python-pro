{% extends "catalog/base.html" %}

{% block title %}Вхід · Книжковий магазин{% endblock %}
{% block content %}
  <h1>Вхід</h1>
  <form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Увійти</button>
  </form>
{% endblock %}
