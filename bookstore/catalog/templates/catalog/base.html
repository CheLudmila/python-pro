{% load static %}
<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Книжковий магазин{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'catalog/store.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar bg-dark navbar-dark" aria-label="Основна навігація">
    <div class="container gap-2">
      <a class="navbar-brand" href="{% url 'catalog:book_list' %}">Книжковий магазин</a>
      <div class="d-flex flex-wrap gap-2">
        {% if perms.catalog.add_book %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'catalog:book_create' %}">Додати книгу</a>
        {% endif %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'admin:index' %}">Адмінка</a>
      </div>
    </div>
  </nav>
  <main class="container py-4 py-md-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
